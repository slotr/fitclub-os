<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A1 — Splash</title>
<link rel="stylesheet" href="_tokens.css">
<style>
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 24px;
    gap: 18px;
  }
  .logo {
    width: 120px; height: 120px;
    border-radius: 28px;
    background: linear-gradient(135deg, #fef3c7 0%, #f59e0b 100%);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-fg);
    font-weight: 800;
    font-size: 64px;
    letter-spacing: -0.04em;
    box-shadow:
      0 18px 40px rgba(245,158,11,0.25),
      0 6px 14px rgba(245,158,11,0.15),
      inset 0 1px 0 rgba(255,255,255,0.5);
    position: relative;
  }
  .logo::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 -2px 6px rgba(0,0,0,0.06);
  }
  .brand {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--fg);
    margin-top: 4px;
  }
  .caption-tag {
    font-size: 12px;
    font-weight: 500;
    color: var(--fg-muted);
    letter-spacing: 0.02em;
  }

  /* override .screen so splash fills the whole viewport (no statusbar/tabbar) */
  .splash-screen {
    width: 100%; height: 100%;
    background: var(--bg);
    border-radius: 44px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .splash-screen::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(80% 60% at 50% 35%, rgba(245,158,11,0.06), transparent 70%),
      radial-gradient(60% 40% at 50% 90%, rgba(0,0,0,0.03), transparent 70%);
    pointer-events: none;
  }
  .splash-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    z-index: 1;
  }
</style>
</head><body>
<div class="stage">
<div>
<div class="phone">
  <div class="splash-screen">
    <div class="splash-inner">
      <div class="logo">F</div>
      <div class="brand">FitClub</div>
      <div class="caption-tag">Powered by FitClub OS</div>
    </div>
  </div>
</div>
<div class="caption"><b>A1 — Splash.</b> Brand impression on cold start.</div>
</div>
</div>
</body></html>
