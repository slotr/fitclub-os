<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A2 — Phone OTP Request</title>
<link rel="stylesheet" href="_tokens.css">
<style>
  .content { flex:1; padding: 8px 22px 0; display: flex; flex-direction: column; }

  .back {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--fg);
    margin: 4px 0 28px;
  }
  .back svg { width: 22px; height: 22px; stroke-width: 2; }

  h1 {
    font-size: 28px; font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    line-height: 1.15;
  }
  .sub {
    font-size: 14px;
    color: var(--fg-muted);
    margin: 0 0 28px;
    line-height: 1.4;
  }

  .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 8px;
  }

  .phone-row {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 8px;
    margin-bottom: 22px;
  }
  .country, .phone-input {
    height: 50px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0 14px;
    font-size: 15px;
    font-weight: 500;
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .country .flag { font-size: 18px; line-height: 1; }
  .country .code { font-variant-numeric: tabular-nums; font-weight: 600; }
  .country .chev { margin-left: auto; color: var(--fg-faint); }
  .phone-input {
    color: var(--fg-faint);
    font-variant-numeric: tabular-nums;
  }

  .cta {
    height: 52px;
    border-radius: 14px;
    background: var(--fg);
    color: var(--surface);
    font-size: 15px;
    font-weight: 600;
    border: 0;
    width: 100%;
    opacity: 0.5;
    cursor: not-allowed;
  }

  .terms {
    margin-top: auto;
    font-size: 11px;
    color: var(--fg-faint);
    text-align: center;
    padding: 18px 8px 24px;
    line-height: 1.5;
  }
  .terms a { color: var(--fg-muted); text-decoration: underline; }
</style>
</head><body>
<div class="stage">
<div>
<div class="phone">
  <div class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <span class="right">●●● 📶 <span class="battery"><span class="fill"></span></span></span>
    </div>

    <div class="content">
      <div class="back">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </div>

      <h1>Welcome back.</h1>
      <p class="sub">Enter your phone to continue.</p>

      <div class="label">Phone number</div>
      <div class="phone-row">
        <div class="country">
          <span class="flag">🇹🇷</span>
          <span class="code">+90</span>
          <svg class="chev" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </div>
        <div class="phone-input">555 123 45 67</div>
      </div>

      <button class="cta">Continue</button>

      <div class="terms">
        By continuing you agree to our <a>Terms</a> and <a>Privacy</a>.
      </div>
    </div>
  </div>
</div>
<div class="caption"><b>A2 — Phone OTP.</b> Phone-first login, no passwords.</div>
</div>
</div>
</body></html>
