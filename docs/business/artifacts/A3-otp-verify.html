<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A3 — OTP Verify</title>
<link rel="stylesheet" href="_tokens.css">
<style>
  .content { flex:1; padding: 8px 22px 0; display: flex; flex-direction: column; }

  .back {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--fg);
    margin: 4px 0 28px;
  }
  .back svg { width: 22px; height: 22px; stroke-width: 2; }

  h1 {
    font-size: 24px; font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .sub {
    font-size: 14px;
    color: var(--fg-muted);
    margin: 0 0 28px;
    line-height: 1.4;
  }

  .otp-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 28px;
  }
  .digit {
    height: 56px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
  }
  .digit.empty {
    color: var(--fg-faint);
  }
  .digit.active {
    border-color: var(--fg);
    border-width: 2px;
  }
  .digit.active::after {
    content: '';
    width: 1.5px;
    height: 22px;
    background: var(--fg);
    animation: blink 1s infinite;
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  .resend {
    text-align: center;
    font-size: 13px;
    color: var(--fg-muted);
    margin-bottom: 14px;
  }
  .resend .muted {
    color: var(--fg-faint);
    font-variant-numeric: tabular-nums;
  }
  .wrong {
    text-align: center;
    font-size: 12px;
    color: var(--fg-muted);
    text-decoration: underline;
  }
</style>
</head><body>
<div class="stage">
<div>
<div class="phone">
  <div class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <span class="right">●●● 📶 <span class="battery"><span class="fill"></span></span></span>
    </div>

    <div class="content">
      <div class="back">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </div>

      <h1>Code sent to +90 555 ••• 11 22.</h1>
      <p class="sub">Enter the 6-digit code below.</p>

      <div class="otp-row">
        <div class="digit">1</div>
        <div class="digit">5</div>
        <div class="digit">9</div>
        <div class="digit empty active"></div>
        <div class="digit empty"></div>
        <div class="digit empty"></div>
      </div>

      <div class="resend">
        Didn't get it? <span class="muted">Resend in 22s</span>
      </div>
      <div class="wrong">Wrong number?</div>
    </div>
  </div>
</div>
<div class="caption"><b>A3 — OTP Verify.</b> 6-digit code, paste-friendly.</div>
</div>
</div>
</body></html>
