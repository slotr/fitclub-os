<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A4 — Profile Complete</title>
<link rel="stylesheet" href="_tokens.css">
<style>
  .content { flex:1; padding: 8px 22px 0; display: flex; flex-direction: column; overflow: hidden; }

  .back {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--fg);
    margin: 4px 0 16px;
  }
  .back svg { width: 22px; height: 22px; stroke-width: 2; }

  h1 {
    font-size: 24px; font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    line-height: 1.2;
  }
  .sub {
    font-size: 13px;
    color: var(--fg-muted);
    margin: 0 0 18px;
  }

  .field { margin-bottom: 12px; }
  .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 6px;
  }
  .input {
    height: 44px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 14px;
    font-size: 14px;
    font-weight: 500;
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .input.placeholder { color: var(--fg-faint); }
  .input .cal-icon { color: var(--fg-faint); margin-left: auto; }

  .seg {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    background: var(--border-faint);
    border-radius: 10px;
    padding: 3px;
  }
  .seg-item {
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--fg-muted);
    text-align: center;
    padding: 0 4px;
  }
  .seg-item.active {
    background: var(--surface);
    color: var(--fg);
    box-shadow: var(--sh-1);
  }

  .photo-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar-slot {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg-faint);
    background: var(--surface);
    flex-shrink: 0;
  }
  .avatar-slot svg { width: 22px; height: 22px; stroke-width: 2; }
  .photo-text {
    font-size: 12px;
    color: var(--fg-muted);
    line-height: 1.4;
  }
  .photo-text b { color: var(--fg); font-weight: 600; }

  .cta {
    margin-top: 16px;
    margin-bottom: 16px;
    height: 50px;
    border-radius: 14px;
    background: var(--fg);
    color: var(--surface);
    font-size: 15px;
    font-weight: 600;
    border: 0;
    width: 100%;
  }
</style>
</head><body>
<div class="stage">
<div>
<div class="phone">
  <div class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <span class="right">●●● 📶 <span class="battery"><span class="fill"></span></span></span>
    </div>

    <div class="content">
      <div class="back">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </div>

      <h1>Tell us about you.</h1>
      <p class="sub">Takes 30 seconds.</p>

      <div class="field">
        <div class="label">Full name</div>
        <div class="input placeholder">Hakan Karaca</div>
      </div>

      <div class="field">
        <div class="label">Birthdate</div>
        <div class="input">
          <span class="tnum">14.05.1992</span>
          <svg class="cal-icon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3M3 11h18M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg>
        </div>
      </div>

      <div class="field">
        <div class="label">Email <span style="color:var(--fg-faint);font-weight:500;text-transform:none;letter-spacing:0">(optional)</span></div>
        <div class="input placeholder">hakan@example.com</div>
      </div>

      <div class="field">
        <div class="label">Gender</div>
        <div class="seg">
          <div class="seg-item">Male</div>
          <div class="seg-item active">Female</div>
          <div class="seg-item">Other</div>
          <div class="seg-item">Prefer not</div>
        </div>
      </div>

      <div class="field">
        <div class="label">Photo <span style="color:var(--fg-faint);font-weight:500;text-transform:none;letter-spacing:0">(optional)</span></div>
        <div class="photo-row">
          <div class="avatar-slot">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14"/></svg>
          </div>
          <div class="photo-text">
            <b>Add a photo</b><br>
            Helps the front desk recognise you.
          </div>
        </div>
      </div>

      <button class="cta">Continue</button>
    </div>
  </div>
</div>
<div class="caption"><b>A4 — Profile.</b> Captured in under 30 seconds.</div>
</div>
</div>
</body></html>
