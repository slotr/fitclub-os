<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>W1 — Admin Login</title>
<link rel="stylesheet" href="_tokens.css">
<style>
  body { background: var(--bg); }
  .stage { padding: 48px 16px; }
  .login-card {
    width: 400px; height: 440px; background: var(--surface);
    border-radius: var(--r-lg); box-shadow: var(--sh-3);
    padding: 32px; display: flex; flex-direction: column;
  }
  .brand-row {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-bottom: 22px;
  }
  .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .brand { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }

  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .sub { margin: 0 0 20px; font-size: 13px; font-weight: 400; color: var(--fg-muted); line-height: 1.5; }

  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 11px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--fg-muted); margin-bottom: 6px;
  }
  .field-input {
    width: 100%; height: 38px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 0 12px; font-size: 13px; color: var(--fg);
    font-family: inherit; outline: none;
  }
  .field-input::placeholder { color: var(--fg-faint); }

  .row-split {
    display: flex; align-items: center; justify-content: space-between;
    margin: 4px 0 16px; font-size: 12px;
  }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); }
  .check input { width: 14px; height: 14px; accent-color: var(--accent); }
  .link { color: var(--fg); text-decoration: none; font-weight: 500; }
  .link:hover { text-decoration: underline; }
  .link.muted { color: var(--fg-muted); }

  .magic {
    margin-top: 12px; text-align: center; font-size: 12px; color: var(--fg-muted);
  }
  .magic a { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }

  .caption {
    margin-top: 24px; text-align: center; color: #444; font-size: 13px; letter-spacing: 0.02em;
  }
  .caption b { color: #111; font-weight: 700; }
</style>
</head><body>
<div class="stage">
  <div>
    <div class="login-card">
      <div class="brand-row">
        <span class="brand-dot"></span>
        <span class="brand">FitClub</span>
      </div>

      <h1>Admin sign in</h1>
      <p class="sub">Use your email and password to continue.</p>

      <div class="field">
        <label>Email</label>
        <input class="field-input" type="email" placeholder="admin@fitclub.demo">
      </div>
      <div class="field">
        <label>Password</label>
        <input class="field-input" type="password" placeholder="••••••••••">
      </div>

      <div class="row-split">
        <label class="check">
          <input type="checkbox" checked>
          Remember me
        </label>
        <a href="#" class="link muted">Forgot password?</a>
      </div>

      <button class="btn full">Sign in</button>

      <div class="magic">
        or <a href="#">use a magic link</a>
      </div>
    </div>

    <div class="caption"><b>W1 — Admin Login.</b> Email + password, optional magic link.</div>
  </div>
</div>
</body></html>
