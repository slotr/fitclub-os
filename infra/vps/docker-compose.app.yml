# FitClub web container.
#
# TLS + routing are handled by the host's system nginx (a vhost for the
# domain proxies / to this container and the Supabase paths to Kong) —
# see infra/vps/nginx-fms.conf and infra/vps/README.md.
#
# The container joins the Supabase stack's network so it can reach the
# database and Kong by service name (db:5432, kong:8000).

name: fitclub

services:
  web:
    container_name: fitclub-web
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - default
      - supabase

networks:
  default:
  # External network created by the Supabase docker-compose stack.
  # Set the real name with: docker network ls | grep supabase
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-supabase_default}
