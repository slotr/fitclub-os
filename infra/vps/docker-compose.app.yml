# FitClub web + reverse proxy.
# Runs alongside the Supabase self-hosted stack (separate compose file —
# see infra/vps/README.md). Both stacks share the supabase_network_<dir>
# Docker network so the web app can reach the internal Supabase URL.

name: fitclub

services:
  web:
    container_name: fitclub-web
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    depends_on:
      - caddy
    networks:
      - default
      - supabase_default

  caddy:
    container_name: fitclub-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN env var is required}
      WEB_HOST: web:3000
    networks:
      - default

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
  # External network created by the Supabase docker-compose stack.
  # Name follows Docker Compose convention: <project_name>_default.
  supabase_default:
    external: true
