# System nginx vhost for FitClub. Place at
# /etc/nginx/sites-available/fms.smart-cms.cloud and symlink into
# sites-enabled, then run: certbot --nginx -d fms.smart-cms.cloud
#
# Single domain: / serves the Next.js app; the Supabase REST/auth/etc
# paths are proxied to Kong so the browser-side supabase-js client can
# use https://fms.smart-cms.cloud as its base URL.

server {
    listen 80;
    listen [::]:80;
    server_name fms.smart-cms.cloud;

    client_max_body_size 25m;

    # --- Supabase (Kong gateway) ---
    location ~ ^/(auth|rest|realtime|storage|functions)/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Next.js app ---
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
